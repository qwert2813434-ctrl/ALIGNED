[package]
name = "aligned-mac"
version = "0.1.0"
description = "ALIGNED — 跨頁對齊排版工具（Mac）"
authors = ["Armin Kao"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
base64 = "0.22"
fontdb = "0.23"
