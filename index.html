<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALIGN Core</title>
<style>
  /* 配色（2026-08-04 小高定案）：Mac App chrome 用**白**——排版標準的米白底
     是網頁類產出的規則，原生 Mac 視窗照系統語彙走，米白在 Mac 上顯舊。
     層次靠留白與字級（字重 400 起）不變。 */
  :root {
    color-scheme: light dark;
    --chrome: #FFFFFF; --card: #FFFFFF; --line: #E2E2E7;
    --ink: #1E1E23; --ink2: #75757C;
  }
  /* 外觀手動切換：html[data-theme] 蓋過系統；沒設＝跟系統（原行為）。
     ⚠️ 深色 token 因此有兩份，改色要同步。#sheet[data-theme] 是匯出台自己的機制，別共用。 */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --chrome: #1D1E22; --card: #292A30; --line: #3A3B42;
            --ink: #F2F2F5; --ink2: #A9A9B2; }
  }
  :root[data-theme="dark"] { --chrome: #1D1E22; --card: #292A30; --line: #3A3B42;
          --ink: #F2F2F5; --ink2: #A9A9B2; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { display: flex; flex-direction: column;
         font: 400 13px/1.5 "PingFang TC", system-ui, sans-serif;
         background: var(--chrome); color: var(--ink); }

  header { display: flex; gap: 10px; align-items: center; flex: none;
           padding: 9px 16px; background: var(--chrome);
           border-bottom: 1px solid var(--line);
           /* 視窗不夠寬時工具列可以橫捲，別把右邊的工具裁到抓不到
              （2026-08-25 小高回報；細捲軸只在溢出時出現） */
           overflow-x: auto; scrollbar-width: thin; }
  /* 標題點一下就地改名（2026-08-29）——hover 才長出可編輯的樣子，平常還是一行字 */
  #title { font-weight: 600; font-size: 14px; white-space: nowrap;
           padding: 2px 6px; margin: 0 -6px; border-radius: 6px; cursor: text; }
  #title:hover { background: var(--chrome); }
  #titleedit { display: none; font: inherit; font-weight: 600; font-size: 14px;
    width: 300px; max-width: 34vw; padding: 2px 6px; margin: 0 -6px; border-radius: 6px;
    border: 1px solid #2F7CF6; background: var(--card); color: var(--ink); outline: none; }
  #meta, #info { font-size: 12px; color: var(--ink2);
                 font-variant-numeric: tabular-nums; white-space: nowrap; }
  /* 狀態訊息先讓位（可截斷），工具島永遠優先佔位 */
  #meta { min-width: 0; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; }
  .spacer { margin-left: auto; }

  /* 膠囊島：白卡浮在米白上，icon 一律單色線性 */
  .island { display: inline-flex; align-items: center; flex: none;
            background: var(--card); border: 1px solid var(--line);
            border-radius: 999px; padding: 3px; gap: 1px;
            box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  .island button { border: none; background: transparent; color: var(--ink);
                   width: 34px; height: 28px; border-radius: 999px; padding: 0;
                   display: inline-flex; align-items: center; justify-content: center;
                   cursor: pointer; }
  .island button:hover { background: color-mix(in srgb, var(--ink) 9%, transparent); }
  .island button:active { background: color-mix(in srgb, var(--ink) 15%, transparent); }
  /* 開著的面板／開關要看得出「亮」——一排工具全同色，狀態等於不存在 */
  .island button.on { background: color-mix(in srgb, #2F7CF6 15%, transparent); color: #2F7CF6; }
  .island svg { display: block; }
  /* 塗鴉桌面版先行（2026-08-25）：iPad 版還在測，畫筆鈕掛小藍 Beta 字樣，
     iOS 送審跟上後拿掉 */
  #doodleBtn { position: relative; }
  #doodleBtn::after { content: "Beta"; position: absolute; top: -1px; right: -2px;
    font-size: 7.5px; font-weight: 700; letter-spacing: .02em; color: #2F7CF6;
    line-height: 1; pointer-events: none; }
  .island .glyph { color: var(--ink2); margin: 0 2px 0 8px; }
  .island select { border: none; background: transparent; color: var(--ink);
                   font: inherit; font-size: 12.5px; padding: 0 4px 0 0;
                   cursor: pointer; outline: none; }
  #zoomfit { width: auto; padding: 0 12px; font-size: 12px;
             font-variant-numeric: tabular-nums; color: var(--ink2); }

  #body { flex: 1; display: flex; min-height: 0; position: relative; }
  /* 選取浮動晶片（2026-09-01，參考小高給的 uiinspo）：選到元件時在它**右側直立排開**，
     每顆是各自獨立的圓形晶片——不是一條工具列。容器不擋畫布點擊，只有晶片收事件。
     按下去圖示原地變成 ✓ 當回饋（不跳提示，滑鼠不用離開現場）。 */
  #selbar {
    position: absolute; z-index: 6; display: none; flex-direction: column; gap: 7px;
    pointer-events: none;
  }
  #selbar.on { display: flex; }
  #selbar button {
    pointer-events: auto; width: 32px; height: 32px; display: grid; place-items: center;
    border: 1px solid var(--line); border-radius: 999px; background: var(--card);
    color: var(--ink); cursor: pointer; padding: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,.14), 0 0 0 .5px rgba(0,0,0,.03);
    transition: transform .13s ease, color .13s ease, border-color .13s ease;
    /* 進場：由右側輕輕滑入，一顆比一顆晚 40ms（順序在 JS 設 --i） */
    animation: selchip .19s cubic-bezier(.2,.9,.3,1) both;
    animation-delay: calc(var(--i, 0) * 40ms);
  }
  @keyframes selchip { from { opacity: 0; transform: translateX(6px) scale(.9); } }
  #selbar button:hover { transform: scale(1.08); color: #2F7CF6; border-color: #2F7CF6; }
  #selbar button:active { transform: scale(.94); }
  #selbar button.warn:hover { color: #E5484D; border-color: #E5484D; }
  #selbar button.on { color: #2F7CF6; border-color: #2F7CF6; }
  #selbar button.done { color: #2F7CF6; border-color: #2F7CF6; }
  @media (prefers-reduced-motion: reduce) { #selbar button { animation: none; } }
  .textedit {
    position: absolute; z-index: 5; margin: 0; padding: 0;
    background: transparent; outline: 1.5px dashed rgba(47,124,246,.75);
    outline-offset: 2px; caret-color: #2F7CF6; cursor: text;
    min-width: 8px; min-height: 8px; overflow: visible;
  }
  #canvas { flex: 1; min-width: 0; display: block; touch-action: none; cursor: default; }

  #inspector { width: 252px; flex: none; border-left: 1px solid var(--line);
               background: var(--chrome);
               overflow-y: auto; padding: 10px 14px 20px; font-size: 12.5px; }
  /* 區段之間給一條**內縮的極淡髮絲線**——刻意比外框的 --line 淡、比它短，
     才不會跟「面板與面板之間」的分隔線撞在一起（2026-08-16 使用者定案） */
  #inspector h3 { font-size: 11px; letter-spacing: .2em; color: var(--ink2);
                  margin: 20px 2px 4px; font-weight: 600; padding-top: 14px;
                  border-top: 1px solid color-mix(in srgb, var(--ink) 9%, transparent); }
  /* 區段都包在 .sec 裡（2026-09-05 歸類）：第一個區段、以及釘在上面那格（.pin）之後的第一個不畫髮絲線 */
  #inspector .sec:first-child h3, #inspector .pin + .sec h3 { border-top: none; padding-top: 0; margin-top: 12px; }
  /* 可收合群組：標題前一個小三角，收起時內容整段不顯示；開合狀態各自記住（inspector.section） */
  #inspector .sec.fold h3 { cursor: pointer; user-select: none; display: flex; align-items: center; gap: 7px; }
  #inspector .sec.fold h3:hover { color: var(--ink); }
  #inspector .sec.fold h3::before { content: ""; width: 0; height: 0; flex: none; opacity: .65;
                                    border-left: 4px solid currentColor; border-top: 3.5px solid transparent;
                                    border-bottom: 3.5px solid transparent; transform: rotate(90deg); transition: transform .12s; }
  #inspector .sec.fold.closed h3::before { transform: rotate(0deg); }
  #inspector .sec.closed .secbody { display: none; }
  /* 換行不是裝飾：面板只有 252px，塞不下的那一列以前是**直接被裁掉**，
     最後一顆按鈕（例：填顏色的自訂顏色）點不到（2026-09-01 小高回報）。 */
  #inspector .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; flex-wrap: wrap; }
  #inspector .row > label { width: 52px; flex: none; color: var(--ink2); }
  #inspector input[type=number] { width: 62px; font: inherit;
    border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px;
    background: var(--card); color: var(--ink); }
  #inspector input[type=color] { width: 34px; height: 22px; padding: 0; border: none; background: none; }
  /* WebKit 的色票畫在 shadow DOM 裡——上面把 border/background 拔掉後，
     WKWebView 可能整顆變透明看不見（Chromium 不會）。顯式把色塊描回來。 */
  #inspector input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
  #inspector input[type=color]::-webkit-color-swatch { border: 1px solid rgba(0,0,0,.18); border-radius: 5px; }
  #inspector input[type=range] { flex: 1; }
  #inspector select { font: inherit; flex: 1; min-width: 0;
    border: 1px solid var(--line); border-radius: 6px; padding: 2px 4px;
    background: var(--card); color: var(--ink); }
  #inspector textarea { font: inherit; flex: 1; resize: vertical;
    border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px;
    background: var(--card); color: var(--ink); }
  #inspector button { font: inherit; font-size: 12px; padding: 3px 10px;
    border: 1px solid var(--line); border-radius: 6px;
    background: var(--card); color: var(--ink); cursor: pointer; }
  #inspector button:hover { background: color-mix(in srgb, var(--ink) 7%, var(--card)); }
  /* 一列多顆勾選（紙張套用範圍）——標籤貼著小方框，整組平分那一列 */
  #inspector .chk { display: inline-flex; align-items: center; gap: 3px; color: var(--ink2); }
  #inspector .chk input { margin: 0; }
  #inspector .row > .chk + .chk { margin-left: 6px; }
  #inspector .seg { display: flex; gap: 4px; flex: 1; }
  #inspector .seg button { flex: 1; padding: 2px 0; }
  /* 參考線產生器的預設縮圖（2026-09-05）：每顆＝那個預設在目前畫布比例真的長出來的線 */
  #inspector .gpgrid { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 6px; }
  #inspector .gp { width: 64px; padding: 5px 2px 4px; border: 1px solid var(--line); border-radius: 7px;
                   background: var(--card); color: var(--ink2); cursor: pointer; font: inherit;
                   font-size: 9.5px; line-height: 1.1; display: flex; flex-direction: column;
                   align-items: center; gap: 4px; }
  #inspector .gp:hover { color: var(--ink); }
  #inspector .gp.on { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); color: var(--ink); }
  #inspector .gp span { max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #inspector .gp svg { display: block; }
  #inspector .gp .pg { fill: var(--chrome); stroke: var(--line); }
  #inspector .gp line { stroke: #2F7CF6; stroke-width: 1; }
  #inspector button.icon { display: inline-flex; align-items: center; justify-content: center; padding: 4px 0; }
  #inspector button.icon svg { display: block; }
  /* 純 icon 但要有正常的點擊面積（圖層那三顆） */
  #inspector button.icon.wide { padding: 4px 9px; }
  /* 蘋果式動作鈕（2026-08-25）：icon＋文字，icon 當輔助不取代字 */
  #inspector button.act { display: inline-flex; align-items: center; justify-content: center;
    gap: 5px; white-space: nowrap; }
  #inspector button.act svg { display: block; flex: none; }
  #inspector button.on { background: color-mix(in srgb, var(--ink) 14%, var(--card)); }
  #inspector button.danger { color: #B3402F; border-color: color-mix(in srgb, #B3402F 40%, var(--line)); }
  #inspector .hint { color: var(--ink2); padding: 22px 4px; white-space: pre-line; line-height: 1.9; }
  /* 停留自動章：頁上有會播的內容（影片／輪播）時，停留鈕換成這個說明 */
  #inspector .holdauto { color: var(--ink2); font-size: 12px; line-height: 26px; cursor: help; }
  /* 釘在側欄上方的面板：自己捲，別把下面的屬性擠出畫面 */
  #inspector .pin { max-height: 46vh; overflow-y: auto; margin: -4px -6px 6px;
                    padding: 0 6px 6px; border-bottom: 1px solid var(--line); }
  #inspector .pin h3:first-child { margin-top: 6px; }
  #inspector .pinhint { padding: 8px 4px 2px; line-height: 1.7; font-size: 11.5px; }
  #inspector .row.hot > label { color: var(--ink); font-weight: 600; }
  /* 圖層列：上＝最前面 */
  #inspector .layers { display: flex; flex-direction: column; gap: 1px; margin: 4px 0 0; }
  #inspector .lay { display: flex; align-items: center; gap: 7px; padding: 4px 6px;
                    border-radius: 6px; cursor: default; border-top: 2px solid transparent; }
  #inspector .lay:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); }
  #inspector .lay.on { background: color-mix(in srgb, #2F7CF6 14%, transparent); }
  #inspector .lay.locked .nm, #inspector .lay.locked .ico { opacity: .45; }
  #inspector .lay.dragging { opacity: .4; }
  #inspector .lay.droptop { border-top-color: #2F7CF6; }
  #inspector .lay .ico { flex: none; display: flex; width: 24px; height: 24px;
                         align-items: center; justify-content: center; color: var(--ink2); }
  #inspector .lay .ico.shot canvas { border-radius: 4px; display: block;
                                     box-shadow: 0 0 0 1px rgba(0,0,0,.10); }
  #inspector .lay .swatch { width: 17px; height: 17px; border-radius: 3px;
                            box-shadow: 0 0 0 1px rgba(0,0,0,.12); }
  #inspector .hint.warn { color: #B3402F; }
  #inspector .lay .nm { flex: 1; min-width: 0; overflow: hidden;
                        text-overflow: ellipsis; white-space: nowrap; }
  #inspector .lay .lk { flex: none; border: none; background: none; padding: 2px;
                        color: var(--ink2); opacity: 0; cursor: pointer; }
  #inspector .lay:hover .lk, #inspector .lay.locked .lk { opacity: 1; }
  #inspector .lay .lk:hover { color: var(--ink); background: none; }

  #strip { flex: none; display: flex; gap: 12px; padding: 8px 14px;
           background: var(--chrome); border-top: 1px solid var(--line); overflow-x: auto; }
  #strip figure { margin: 0; flex: none; text-align: center; }
  #strip canvas { height: 64px; width: auto; display: block; cursor: pointer;
                  box-shadow: 0 1px 3px rgba(0,0,0,.18); border-radius: 2px; }
  #strip figcaption { font-size: 10px; color: var(--ink2); margin-top: 3px; }
  #strip figure { position: relative; }
  /* 拖曳中的頁卡：原位留一張淡的，真正被抓著的那張浮在游標上 */
  #strip figure.dragging canvas { opacity: .3; }
  .pageghost { position: fixed; z-index: 30; pointer-events: none;
               transform: rotate(-1.5deg) scale(1.06); transform-origin: 50% 50%;
               filter: drop-shadow(0 10px 22px rgba(0,0,0,.32)); }
  .pageghost canvas { display: block; border-radius: 3px; }
  #strip figure.dropleft::before { content: ""; position: absolute; left: -7px; top: 0; bottom: 14px;
                                   width: 2px; border-radius: 2px; background: #2F7CF6; }
  .addpage { display: flex; align-items: center; }
  .addtile { height: 64px; width: 46px; border: 1px dashed var(--line); border-radius: 3px;
             background: transparent; color: var(--ink2); cursor: pointer;
             display: inline-flex; align-items: center; justify-content: center; }
  .addtile:hover { color: var(--ink); border-color: var(--ink2); }


  /* ── 開場首頁：最近專案＋兩個動作。App 的第一眼，安靜、就緒。
     底色跟 App chrome 同一張皮（Mac 原生視窗用白是 2026-08-04 的定案例外）；
     層次全靠字級落差與留白，卡片只有髮絲線——編輯器是髮絲線派，首頁不換派。 */
  #home { position: fixed; inset: 0; z-index: 11; display: none; overflow-y: auto;
          background: var(--chrome); }
  #home.on { display: block; }
  #homewrap { max-width: 880px; margin: 0 auto; padding: 72px 44px 64px; }
  #home .brand { font-size: 14px; font-weight: 600; letter-spacing: .32em; color: var(--ink); }
  #home .brandsub { font-size: 12px; color: var(--ink2); margin-top: 7px; letter-spacing: .04em; }
  #homeacts { display: flex; gap: 12px; margin: 34px 0 10px; }
  #homeacts button { display: flex; align-items: center; gap: 10px;
    font: inherit; font-size: 13px; padding: 13px 22px; cursor: pointer;
    border: 1px solid var(--line); border-radius: 12px;
    background: var(--card); color: var(--ink); }
  #homeacts button:hover { background: color-mix(in srgb, var(--ink) 5%, var(--card)); }
  #homeacts .k { color: var(--ink2); font-size: 11.5px; margin-left: 2px;
                 font-variant-numeric: tabular-nums; }
  #home .samples { font-size: 12.5px; color: var(--ink2); margin: 0 2px; }
  #home .samples a { color: var(--ink2); cursor: pointer; text-decoration: underline;
                     text-underline-offset: 3px; }
  #home .samples a:hover { color: var(--ink); }
  #home h3 { font-size: 11px; letter-spacing: .2em; color: var(--ink2);
             margin: 44px 0 12px; font-weight: 600; }
  /* 真瀑布流（2026-09-03 小高：「縮圖還是 16:9」）——原本 .shot 固定 128px 高＋
     object-fit: cover，直式 4:5 的專案被裁成橫條，認不出是哪份。改 CSS columns：
     卡片照專案原比例把縮圖**整張**顯示出來，直式就是直式。
     columns 是逐欄填充（最新的在最左欄往下走），break-inside 防卡片被攔腰切欄。 */
  #recentgrid { columns: 196px; column-gap: 14px; }
  #recentgrid .empty { column-span: all; }
  .recent { position: relative; border: 1px solid var(--line); border-radius: 12px;
            overflow: hidden; cursor: pointer; background: var(--card);
            break-inside: avoid; margin-bottom: 14px; }
  .recent:hover { border-color: var(--ink2); }
  .recent .shot { display: flex; align-items: center; justify-content: center;
                  background: color-mix(in srgb, var(--ink) 5%, var(--chrome)); }
  .recent .shot img { width: 100%; height: auto; display: block; }
  /* 沒縮圖的占位卡維持一個看得出是卡的高度 */
  .recent .shot:not(:has(img)) { height: 128px; }
  .recent .shot svg { color: var(--ink2); }
  .recent .nm { font-size: 13px; font-weight: 600; padding: 9px 12px 0;
                overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .recent .pt { font-size: 11px; color: var(--ink2); padding: 2px 12px 10px;
                overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .recent .rm { position: absolute; top: 6px; right: 6px; width: 22px; height: 22px;
                display: none; align-items: center; justify-content: center;
                border: none; border-radius: 6px; cursor: pointer;
                background: color-mix(in srgb, var(--ink) 55%, transparent); color: #fff; }
  .recent:hover .rm { display: flex; }
  #home .empty { color: var(--ink2); font-size: 12.5px; line-height: 1.9; padding: 6px 2px; }

  /* 更新橫幅（STB 同款機制）：安靜浮在下緣，可略過此版 */
  .updbar { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
            z-index: 13; display: flex; align-items: center; gap: 10px;
            background: var(--card); border: 1px solid var(--line); border-radius: 999px;
            padding: 8px 10px 8px 16px; box-shadow: 0 10px 30px rgba(0,0,0,.16);
            font-size: 12.5px; max-width: min(640px, 92vw); }
  .updbar .updtxt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .updbar button { font: inherit; font-size: 12px; padding: 4px 12px; border-radius: 999px;
                   border: 1px solid var(--line); background: var(--chrome); color: var(--ink);
                   cursor: pointer; flex: none; }
  .updbar .updgo { background: #2F7CF6; border-color: #2F7CF6; color: #fff; }

  /* 新專案：小卡片，不用整頁沙發——選項只有三個 */
  #newsheet, #rensheet { position: fixed; inset: 0; z-index: 12; display: none;
              align-items: center; justify-content: center;
              background: color-mix(in srgb, var(--ink) 22%, transparent); backdrop-filter: blur(3px); }
  #newsheet.on, #rensheet.on { display: flex; }
  #newcard, #rencard { width: 340px; background: var(--card); color: var(--ink);
             border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px 16px;
             box-shadow: 0 18px 60px rgba(0,0,0,.28); }
  #newcard h2, #rencard h2 { margin: 0 0 14px; font-size: 15px; font-weight: 600; }
  #newcard .row, #rencard .row { display: flex; align-items: center; gap: 10px; margin: 10px 0; }
  #newcard .row > label, #rencard .row > label { width: 56px; flex: none; color: var(--ink2); font-size: 12.5px; }
  #newcard input, #rencard input, #newcard select, #rencard select { font: inherit; font-size: 12.5px; flex: 1; min-width: 0;
    border: 1px solid var(--line); border-radius: 7px; padding: 4px 8px;
    background: var(--chrome); color: var(--ink); }
  #newcard input[type=number], #rencard input[type=number] { flex: none; width: 68px; }
  #ratiobox { display: flex; align-items: center; gap: 12px; margin: 14px 0 4px;
              padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
  #ratiosw { border: 1.5px solid #2F7CF6; border-radius: 4px; flex: none; }
  #ratiotxt { font-size: 12.5px; color: var(--ink2); font-variant-numeric: tabular-nums; line-height: 1.7; }
  #newcard .acts, #rencard .acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  #newcard button, #rencard button { font: inherit; font-size: 12.5px; padding: 5px 14px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--chrome); color: var(--ink); cursor: pointer; }
  #newcard button.primary, #rencard button.primary { background: #2F7CF6; border-color: #2F7CF6; color: #fff; }

  /* 修剪視窗：底片條上兩根把手夾出選取範圍，外面壓暗。照 iOS VideoTrimView 的語彙 */
  /* 去背編輯間（2026-08-25）——控制面板固定在左側，捲動畫布時滑桿一直在手邊 */
  /* z-index 要壓過右鍵選單（20）——進編輯間前選單還開著的話會浮在上面 */
  #mattesheet { position: fixed; inset: 0; z-index: 22; display: flex; background: var(--chrome); }
  #mattebar { width: 244px; flex: 0 0 244px; display: flex; flex-direction: column; gap: 16px;
    padding: 20px 18px; overflow-y: auto; background: var(--card); border-right: 1px solid var(--line); }
  #mattebar .grp { display: flex; flex-direction: column; gap: 7px; }
  #mattebar .lab { font-size: 11px; letter-spacing: .1em; color: var(--ink2); text-transform: uppercase;
    display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  #mattebar .lab i { font-style: normal; text-transform: none; letter-spacing: 0; font-variant-numeric: tabular-nums; }
  #mattebar .row { display: flex; gap: 6px; flex-wrap: wrap; }
  #mattebar .sect { font-size: 10px; letter-spacing: .14em; color: var(--ink2); opacity: .7;
    text-transform: uppercase; border-top: 1px solid var(--line); padding-top: 12px; }
  #mattebar button.chip { background: transparent; border: 1px solid var(--line); color: var(--ink2);
    padding: 5px 10px; font: inherit; font-size: 12px; border-radius: 6px; cursor: pointer; }
  #mattebar button.chip:hover { color: var(--ink); }
  #mattebar button.chip.on { background: var(--ink); color: var(--chrome); border-color: var(--ink); }
  #mattebar button.chip:disabled { opacity: .35; cursor: default; }
  #mattebar button.chip kbd { margin-left: 5px; opacity: .55; border: 1px solid currentColor;
    border-radius: 3px; padding: 0 4px; font: inherit; font-size: 10px; }
  #mattebar input[type=range] { width: 100%; }
  #mattebar .keys { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--line);
    font-size: 11px; color: var(--ink2); line-height: 1.9; }
  #mattebar .keys b { color: var(--ink); display: block; margin-bottom: 2px; }
  #mattebar .keys .k { display: flex; justify-content: space-between; gap: 10px; }
  #mattebar .keys kbd { border: 1px solid var(--line); border-radius: 3px; padding: 0 4px;
    font: inherit; font-size: 10px; color: var(--ink); }
  #mattebar .acts { display: flex; gap: 8px; }
  #mattebar .acts button { flex: 1; padding: 7px 0; border-radius: 7px; border: 1px solid var(--line);
    background: transparent; color: var(--ink); font: inherit; font-size: 13px; cursor: pointer; }
  #mattebar .acts button.primary { background: var(--ink); color: var(--chrome); border-color: var(--ink); }
  /* 材質選擇：按鈕框本身就是那塊材質，不寫名字（名字只留在 hover 的 title）。
     右欄與編輯間共用同一組樣式，兩邊看起來才是同一件事。 */
  /* background-size 是裁切不是縮放：整張 1400² 縮進 36px 會糊成一坨灰，
     什麼材質都長一樣。裁一塊 220px 的角落下來看，橫線就是橫線、墨點就是墨點。
     使用者自選的圖是照片不是材質，那要看全貌，所以走 .photo 的 cover。 */
  .texsw { width: 36px; height: 36px; padding: 0; flex: none; border-radius: 7px;
    border: 1px solid var(--line); background-size: 220px; background-position: center;
    cursor: pointer; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .texsw.photo { background-size: cover; }
  .texsw.on { border-color: var(--ink); box-shadow: 0 0 0 2px var(--ink); }
  .texsw:disabled { opacity: .35; cursor: default; }
  .texsw.plain { background: transparent; color: var(--ink2); }
  .texsw.plain:hover { color: var(--ink); }
  .texsw.dashed { border-style: dashed; }
  /* 小顆色票（文字／圖形／塗鴉／頁面背景的顏色列，2026-09-05）：圓形 26px，選中＝墨色環 */
  .texsw.swsm { width: 26px; height: 26px; border-radius: 50%; }
  .texsw.swsm.on { border-color: transparent; box-shadow: 0 0 0 2px var(--chrome), 0 0 0 3.5px var(--ink); }
  /* 顏色鈕（陰影色／底色／外框色／貼紙邊／孔版油墨）：點開自家選色面板 */
  .cchip { width: 34px; height: 22px; padding: 0; border: 1px solid rgba(0,0,0,.18); border-radius: 5px; cursor: pointer; }
  /* 數字欄＋拉桿一組（2026-09-05） */
  #inspector .ns { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; }
  #inspector .ns input[type=range] { flex: 1; min-width: 40px; }
  #inspector .ns input[type=number] { width: 62px; flex: none; }   /* 與單獨的數字欄同寬，側欄才齊 */
  /* 自家選色面板（colorpop.ts）：色票／深淺／標準色／灰階＋任何顏色 */
  #colorpop { position: fixed; z-index: 30; width: 264px; padding: 10px 10px 9px;
              background: color-mix(in srgb, var(--card) 97%, transparent); border: 1px solid var(--line);
              border-radius: 10px; box-shadow: 0 12px 40px rgba(0,0,0,.22); backdrop-filter: blur(12px); }
  #colorpop .cp-h { font-size: 10.5px; letter-spacing: .12em; color: var(--ink2); margin: 7px 0 4px; }
  #colorpop .cp-h:first-child { margin-top: 0; }
  #colorpop .cp-row { display: flex; flex-wrap: wrap; gap: 4px; }
  #colorpop .cp-grid { display: grid; gap: 3px; }
  #colorpop .cp-sw { width: 20px; height: 20px; border-radius: 5px; padding: 0; cursor: pointer;
                     border: 1px solid rgba(0,0,0,.14); }
  #colorpop .cp-grid .cp-sw { width: 100%; height: auto; aspect-ratio: 1; border-radius: 4px; }
  #colorpop .cp-sw.on { box-shadow: 0 0 0 2px var(--chrome), 0 0 0 3.5px var(--ink); }
  #colorpop .cp-foot { display: flex; gap: 8px; align-items: center; margin-top: 9px; }
  #colorpop .cp-hex { width: 86px; font: inherit; font-size: 12px; font-variant-numeric: tabular-nums;
                      border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px;
                      background: var(--card); color: var(--ink); }
  #colorpop .cp-any { position: relative; font-size: 12px; color: var(--ink2); cursor: pointer;
                      padding: 2px 8px; border: 1px dashed var(--line); border-radius: 6px; }
  #colorpop .cp-any:hover { color: var(--ink); }
  #colorpop .cp-any input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
  /* 色票／材質票要換行。檢視器只有 252px 寬，扣掉左右內距與 52px 的欄名剩約 168px＝
     一排放得下四顆；不換行的話整排會溢出面板，**最後那顆自訂顏色點不到**
     （2026-09-01 小高回報）。容器自己 flex-wrap，欄名還是留在左邊那一欄。 */
  .swgrid { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 6px; }
  /* 自訂顏色：外觀跟「自選…」那顆一樣（虛線＋加號），真正的原生選色器透明疊在上面 */
  .swpick { position: relative; }
  #inspector .swpick input[type=color] { position: absolute; inset: 0;
    width: 100%; height: 100%; padding: 0; margin: 0; border: none;
    opacity: 0; cursor: pointer; }

  #mattestage { flex: 1; position: relative; overflow: hidden;
    background-image: repeating-conic-gradient(rgba(128,128,128,.10) 0 25%, transparent 0 50%);
    background-size: 18px 18px; }
  #mattecv { position: absolute; inset: 0; width: 100%; height: 100%; display: block;
    cursor: none; touch-action: none; }
  #mattehud { position: absolute; left: 14px; bottom: 12px; font-size: 12px; color: var(--ink2);
    background: var(--card); border: 1px solid var(--line); border-radius: 6px;
    padding: 5px 10px; pointer-events: none; }

  #trimsheet { position: fixed; inset: 0; z-index: 14; display: flex;
               align-items: center; justify-content: center;
               background: color-mix(in srgb, var(--ink) 30%, transparent); backdrop-filter: blur(3px); }
  #trimcard { width: min(620px, 88vw); background: var(--card); color: var(--ink);
              border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px 16px;
              box-shadow: 0 18px 60px rgba(0,0,0,.30); }
  #trimcard h2 { margin: 0 0 12px; font-size: 15px; font-weight: 600; }
  #trimname { color: var(--ink2); font-weight: 400; font-size: 12.5px; margin-left: 8px; }
  #trimvid { width: 100%; max-height: 46vh; display: block; border-radius: 9px;
             background: #000; object-fit: contain; }
  #trimbar { position: relative; height: 46px; margin: 14px 0 10px; border-radius: 7px;
             overflow: hidden; background: var(--chrome); user-select: none; touch-action: none; }
  #trimstrip { display: flex; height: 100%; }
  #trimstrip canvas { height: 100%; flex: 1 1 0; min-width: 0; object-fit: cover; }
  #trimdim, #trimdim2 { position: absolute; top: 0; bottom: 0; background: rgba(0,0,0,.55);
                        pointer-events: none; }
  #trimwin { position: absolute; top: 0; bottom: 0; border: 2px solid #2F7CF6;
             border-radius: 4px; cursor: grab; box-sizing: border-box; }
  #trimbar .grip { position: absolute; top: 0; bottom: 0; width: 14px; margin-left: -7px;
                   background: #2F7CF6; border-radius: 4px; cursor: ew-resize; }
  #trimbar .grip::after { content: ""; position: absolute; left: 5.5px; top: 15px;
                          width: 3px; height: 16px; border-radius: 2px; background: rgba(255,255,255,.85); }
  #trimhead { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px;
              background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.45); pointer-events: none; }
  #trimmeta { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--ink2);
              font-variant-numeric: tabular-nums; }
  #trimmeta .spacer { flex: 1; }
  #trimwarn { color: #b8791f; }
  #trimcard .acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  #trimcard button { font: inherit; font-size: 12.5px; padding: 5px 14px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--chrome); color: var(--ink); cursor: pointer; }
  #trimcard button.primary { background: #2F7CF6; border-color: #2F7CF6; color: #fff; }
  #trimcard button.icon { padding: 4px 9px; display: inline-flex; align-items: center; }

  /* 右鍵選單：浮起的小卡，行高鬆、快捷鍵靠右——照 macOS 的語彙 */
  /* 操作導覽的藍框：框住現在要動的那個東西，其餘用大陰影壓一層淡的；
     pointer-events 穿透——框只是指路，動作照常落在底下的真介面上 */
  #tourspot { position: fixed; z-index: 14; pointer-events: none; display: none;
    border: 2px solid #2F7CF6; border-radius: 12px;
    box-shadow: 0 0 0 100vmax rgba(18,18,24,.14), 0 0 0 5px rgba(47,124,246,.22);
    transition: left .15s ease-out, top .15s ease-out, width .15s ease-out, height .15s ease-out;
    animation: tourpulse 1.7s ease-in-out infinite; }
  @keyframes tourpulse {
    50% { box-shadow: 0 0 0 100vmax rgba(18,18,24,.14), 0 0 0 11px rgba(47,124,246,.09); } }
  /* 操作導覽的教練卡：浮在頁面條上方置中，安靜的一條——說明在卡上，動作在畫布上 */
  #tourcard { position: fixed; left: 50%; transform: translateX(-50%); bottom: 118px; z-index: 15;
    display: flex; align-items: center; gap: 12px; max-width: min(700px, calc(100vw - 48px));
    padding: 11px 13px 11px 18px; background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; box-shadow: 0 1px 1px rgba(0,0,0,.04), 0 14px 30px -16px rgba(0,0,0,.35); }
  #tourcard .tourn { font-size: 11.5px; color: var(--ink2); letter-spacing: .08em; flex: none; }
  #tourcard .tourtxt { font-size: 13px; color: var(--ink); line-height: 1.65; }
  #tourcard button { flex: none; border: 1px solid var(--line); background: none; color: var(--ink);
    border-radius: 8px; padding: 6px 12px; font-size: 12.5px; cursor: pointer; }
  #tourcard .tourgo:hover { background: #2F7CF6; border-color: #2F7CF6; color: #fff; }
  #tourcard .tourquit { border: none; color: var(--ink2); }
  #tourcard .tourquit:hover { color: var(--ink); }
  #ctxmenu { position: fixed; z-index: 20; display: none; min-width: 178px; padding: 5px;
             background: color-mix(in srgb, var(--card) 96%, transparent);
             border: 1px solid var(--line); border-radius: 10px;
             box-shadow: 0 12px 40px rgba(0,0,0,.22); backdrop-filter: blur(12px); }
  #ctxmenu button { display: flex; width: 100%; align-items: center; justify-content: space-between;
                    gap: 20px; border: none; background: transparent; color: var(--ink);
                    font: inherit; font-size: 12.5px; padding: 5px 10px; border-radius: 6px;
                    cursor: pointer; text-align: left; }
  #ctxmenu button:hover { background: #2F7CF6; color: #fff; }
  #ctxmenu hr { border: none; border-top: 1px solid var(--line); margin: 4px 8px; }
  /* 選單行首 icon（2026-08-26 起選單一律配 icon）：跟字垂直對中、留 8px 間距 */
  #ctxmenu .mi { display: inline-flex; vertical-align: -2px; margin-right: 8px; }
  /* 子選單：滑到那一列才展開，往右長出來 */
  #ctxmenu .hassub { position: relative; }
  #ctxmenu .sub { display: none; position: absolute; left: 100%; top: -5px; min-width: 130px;
                  padding: 5px; background: color-mix(in srgb, var(--card) 96%, transparent);
                  border: 1px solid var(--line); border-radius: 10px;
                  box-shadow: 0 12px 40px rgba(0,0,0,.22); backdrop-filter: blur(12px);
                  max-height: 60vh; overflow-y: auto; }
  #ctxmenu .hassub:hover .sub { display: block; }
  #ctxmenu .sub button { color: var(--ink); }
  #ctxmenu .k { color: var(--ink2); font-size: 11.5px; }
  #ctxmenu button:hover .k { color: rgba(255,255,255,.75); }

  /* ── 匯出台：畫廊 ─────────────────────────────────────────────────
     看成品的時刻，介面退場，作品掛在牆上。兩種牆，只有這兩種：
     **白盒**（純白，美術館的 white cube）與**暗房**（關燈看片）。
     這裡刻意不用米白——米白是閱讀面的皮，掛作品會像文書軟體。
     排版標準那條「底不用純白」標了媒介邊界：純展示品例外，這裡就是純展示。
     白牆＋白頁沒有明度差，所以邊界完全交給陰影（分層只用一種手段，不加框）。
     桌面的重點是「看得夠近」：三種排法共用同一台可拖曳、可縮放的視窗，
     縮放才是主角，排法只是把同一批頁面重新掛一次。 */
  #sheet {
    --wall: #FFFFFF; --ink: #1B1A18; --ink2: #6E6A65; --faint: #A9A39D;
    --track: rgba(0,0,0,.055); --chip: #FFFFFF; --hair: rgba(0,0,0,.16);
    --hover: rgba(0,0,0,.05); --dot: rgba(0,0,0,.18);
    --chipshadow: 0 1px 1px rgba(0,0,0,.06), 0 5px 12px -7px rgba(0,0,0,.5);
    --lift: 0 2px 5px rgba(0,0,0,.08), 0 44px 92px -44px rgba(0,0,0,.5);
    position: fixed; inset: 0; z-index: 10; display: none; flex-direction: column;
    background: var(--wall); color: var(--ink); }
  #sheet[data-theme="dark"] {
    --wall: #121216; --ink: #F2F2F5; --ink2: #9B9BA6; --faint: #6E6E79;
    --track: rgba(255,255,255,.07); --chip: rgba(255,255,255,.15); --hair: rgba(255,255,255,.22);
    --hover: rgba(255,255,255,.10); --dot: rgba(242,242,245,.28);
    --chipshadow: none;
    --lift: 0 2px 8px rgba(0,0,0,.5), 0 44px 92px -40px rgba(0,0,0,.85); }
  #sheet.on { display: flex; }
  #sheet header { flex: none; display: flex; align-items: center; gap: 14px;
                  padding: 14px 22px; background: transparent; border-bottom: none; }
  #sheetTitle { font-size: 13px; font-weight: 400; color: var(--ink); white-space: nowrap; }
  #sheetSub { font-size: 11px; letter-spacing: .22em; color: var(--faint);
              white-space: nowrap; font-variant-numeric: tabular-nums; }
  /* 分段控制：灰軌內凹＋選中項浮起（排版標準・無框派） */
  #sheet .ctl { display: inline-flex; align-items: center; gap: 2px;
                background: var(--track); border-radius: 999px; padding: 3px; }
  #sheet .ctl button, #sheet .ctl select {
    border: none; background: transparent; color: var(--ink2); font: inherit; font-size: 12px;
    padding: 4px 12px; border-radius: 999px; cursor: pointer; }
  #sheet .ctl button.on { background: var(--chip); color: var(--ink); box-shadow: var(--chipshadow); }
  #sheet .ctl button:hover { color: var(--ink); }
  #sheet .ctl button.icon { padding: 4px 9px; display: inline-flex; align-items: center; }
  #sheet .ctl select { padding-right: 6px; }
  #sheet[data-theme="dark"] .ctl select option { color: #1E1E23; }
  #zoomval { min-width: 52px; text-align: center; font-variant-numeric: tabular-nums; }
  #saveAll, #saveCur { border: 1px solid var(--hair); background: transparent;
             color: var(--ink); font-size: 12px; padding: 6px 16px; border-radius: 999px; cursor: pointer; }
  #saveAll:hover, #saveCur:hover { background: var(--hover); }
  #closeSheet { border: none; background: transparent; color: var(--faint); font-size: 12px;
                padding: 6px 10px; cursor: pointer; }
  #closeSheet:hover { color: var(--ink); }
  /* 主題鈕：半黑半白的圓＝這頁的明暗，不用 emoji */
  #themeBtn .fill { fill: currentColor; }

  /* 舞台＝一扇窗，#shots 是被拖動的那一層（整層一次 transform，縮放才跟得上手） */
  #stage { flex: 1; min-height: 0; position: relative; overflow: hidden; cursor: grab; }
  #stage.grabbing { cursor: grabbing; }
  #shots { position: absolute; left: 0; top: 0; transform-origin: 0 0;
           display: flex; align-items: flex-start; will-change: transform; }
  #shots figure { margin: 0; position: relative; flex: none; }
  #shots canvas { display: block; }
  #shots figcaption { display: none; }
  /* 分開：一次一張，看單頁的全貌 */
  #stage.single figure { display: none; }
  #stage.single figure.cur { display: block; }
  /* 白牆上白頁沒有明度差，邊界全靠這道影子——它是唯一的分層手段 */
  #stage.single canvas, #stage.cards canvas { box-shadow: var(--lift); }
  /* 連續：頁貼著頁，整條共用一道影子——接縫上不能有陰影，不然看不出對不對得齊 */
  #stage.joined #shots { box-shadow: var(--lift); }
  /* 摺頁：一頁一張卡，卡下掛一張作品牌 */
  #stage.cards #shots { gap: 70px; }
  #stage.cards canvas { border-radius: 16px; }
  #stage.cards figcaption { display: block; position: absolute; left: 50%; top: 100%;
    margin-top: 14px; transform-origin: 50% 0; font-size: 11px; letter-spacing: .26em;
    color: var(--faint); white-space: nowrap; font-variant-numeric: tabular-nums; }
  #shots figure { cursor: inherit; }
  /* 影片徽章與作品牌都會被 JS 反向縮放：它們是說明不是作品，字級要一直一樣大 */
  .vidbadge { position: absolute; left: 22px; top: 22px; display: none; transform-origin: 0 0;
              align-items: center; gap: 5px; padding: 4px 9px; border-radius: 999px;
              background: rgba(24,22,18,.6); color: #fff; font-size: 11px; letter-spacing: .06em; }
  figure.video .vidbadge { display: inline-flex; }

  /* 頁碼點＋說明：整個匯出台唯一的文字，安靜就好 */
  #sheetFoot { flex: none; display: flex; flex-direction: column; align-items: center;
               gap: 8px; padding: 10px 0 18px; }
  #dots { display: flex; gap: 7px; }
  #dots i { width: 6px; height: 6px; border-radius: 99px; background: var(--dot);
            cursor: pointer; transition: background .15s; }
  #dots i.on { background: var(--ink); }
  #hint { font-size: 11px; letter-spacing: .22em; color: var(--ink2);
          font-variant-numeric: tabular-nums; }
  #hint2 { font-size: 10.5px; letter-spacing: .2em; color: var(--faint); }
  /* 新功能標（2026-08-26 小高：「新功能都幫我加上 New」；下一版拿掉） */
  .new-tag { font-style: normal; font-size: 9px; font-weight: 700; color: #2F7CF6;
    border: 1px solid rgba(47,124,246,.4); border-radius: 4px; padding: 0 4px; flex: none; }
</style>
</head>
<body>
  <header>
    <span class="island"><button id="homeBtn" title="回首頁（最近專案）"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 9.7L10 3.8l6.5 5.9"/><path d="M5.4 8.6v7.4h9.2V8.6"/></svg></button></span>
    <span id="title" title="點一下改名">載入中</span><input id="titleedit" type="text" spellcheck="false" autocomplete="off">
    <span id="meta"></span>
    <span id="info"></span>
    <span class="spacer"></span>
    <span class="island" id="addbar">
      <button data-kind="text" title="加文字"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 6V4.5h11V6"/><path d="M10 4.5V15"/><path d="M7.5 15.5h5"/></svg></button><button id="shapeBtn" title="加圖形（矩形／圓形／線條）"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="9.5" height="9.5" rx="1.5"/><circle cx="13" cy="13.5" r="4.2"/></svg></button><button data-kind="photo" title="加照片"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="14" height="12" rx="2"/><circle cx="7.3" cy="8.2" r="1.25"/><path d="M3.4 13.6l3.8-2.9 3.4 2.5 2.4-1.7 3.6 2.5"/></svg></button><button data-kind="doodle" id="doodleBtn" title="塗鴉（畫筆；Esc 離開）"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 15.5c.4-2.6 1-4 2-5l7.6-7.6 2.5 2.5L8 13c-1 1-2.4 1.6-4.5 2.5z"/><path d="M11.6 4.4l2.5 2.5"/></svg></button><button data-kind="model" title="加 3D 物件"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2.8l6.2 3.6v7.2L10 17.2 3.8 13.6V6.4z"/><path d="M3.8 6.4L10 10l6.2-3.6"/><path d="M10 10v7.2"/></svg></button>
    </span>
    <span class="island">
      <button id="guidesBtn" title="參考線"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="13" height="13" rx="1.6" opacity=".45"/><path d="M8 2.6v14.8"/><path d="M2.6 12.4h14.8"/></svg></button><button id="layersBtn" title="圖層"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2.8l6.6 3.5L10 9.8 3.4 6.3z"/><path d="M3.4 10.2L10 13.7l6.6-3.5"/><path d="M3.4 14l6.6 3.5 6.6-3.5"/></svg></button><button id="infoBtn" title="專案資訊（頁數・尺寸・選取座標）"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="6.5"/><path d="M10 9.3v3.9"/><path d="M10 6.8v.01"/></svg></button>
    </span>
    <span class="island">
      <button id="playBtn" title="播放出場動畫（循環）"><svg width="18" height="18" viewBox="0 0 20 20" fill="currentColor" stroke="none"><path d="M6.5 4.2l9 5.8-9 5.8z"/></svg></button>
    </span>
    <span class="island">
      <button id="undoBtn" title="復原（⌘Z）"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 4.5L4 8l3.5 3.5"/><path d="M4 8h7.5a4.5 4.5 0 014.5 4.5V15"/></svg></button><button id="redoBtn" title="重做（⇧⌘Z）"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4.5L16 8l-3.5 3.5"/><path d="M16 8H8.5A4.5 4.5 0 004 12.5V15"/></svg></button>
    </span>
    <span class="island">
      <button id="fileBtn" title="檔案（新專案・開啟・存檔・範本・打包）"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M11.5 3.5H5.8A1.3 1.3 0 004.5 4.8v10.4a1.3 1.3 0 001.3 1.3h8.4a1.3 1.3 0 001.3-1.3V7.5z"/><path d="M11.5 3.5v4h4"/><path d="M7.3 11.2h5.4M7.3 13.8h5.4"/></svg></button><button id="export" title="匯出 PNG（⌘E）"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="6.5" width="9.5" height="9.5" rx="1.6"/><circle cx="6.6" cy="9.6" r="1"/><path d="M3.8 14.6l3-2.5 2.4 1.9 2.3-1.9"/><path d="M13.4 2.8h3.3v3.3"/><path d="M16.7 2.8l-4.4 4.4"/></svg></button>
    </span>
    <!-- 收進「檔案」選單的五顆：留在 DOM 讓綁定與快捷鍵照舊，選單項替它們 .click()（2026-09-05） -->
    <span id="fileHidden" style="display:none"><button id="newproj" title="新專案（⌘N）"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M11.5 3.5H5.8A1.3 1.3 0 004.5 4.8v10.4a1.3 1.3 0 001.3 1.3h8.4a1.3 1.3 0 001.3-1.3V7.5z"/><path d="M11.5 3.5v4h4"/></svg></button><button id="open" title="開啟（⌘O）"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14.5V5.5A1.5 1.5 0 014.5 4h3.2L9.4 6h6.1A1.5 1.5 0 0117 7.5v1"/><path d="M3 14.5L4.6 9.2A1.5 1.5 0 016 8.1h10.9a1 1 0 01.96 1.28l-1.36 4.55a1.5 1.5 0 01-1.44 1.07H3z"/></svg></button><button id="save" title="存檔（⌘S）"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 5.8A1.3 1.3 0 015.8 4.5h7.4l2.3 2.3v7.4a1.3 1.3 0 01-1.3 1.3H5.8a1.3 1.3 0 01-1.3-1.3z"/><path d="M7.2 4.5v3.1h4.6V4.5"/><path d="M7 15.5v-3.8a.6.6 0 01.6-.6h4.8a.6.6 0 01.6.6v3.8"/></svg></button><button id="exporttpl" title="匯出範本（不含素材）"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4" width="13" height="12" rx="1.6"/><path d="M3.5 8h13"/><path d="M8 16V8"/></svg></button><button id="exportpack" title="打包 .alignproj（含素材，iPad 可開）"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 7.5l6.5-3 6.5 3v7l-6.5 3-6.5-3z"/><path d="M3.5 7.5l6.5 3 6.5-3"/><path d="M10 10.5v6"/></svg></button></span>
    <span class="island">
      <span class="glyph" id="sampleGlyph"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="5.6" height="13" rx="1"/><rect x="11" y="3.5" width="5.5" height="6" rx="1"/><rect x="11" y="11" width="5.5" height="5.5" rx="1"/></svg></span><select id="sample">
        <option value="/samples/real">真實專案</option>
        <option value="/samples/intro">說明輪播</option>
        <option value="/samples/credits">舊範本</option>
        <option value="/samples/wrap">排開示範</option>
      </select>
      <span class="glyph"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4.2 3.5v6.2a5.8 5.8 0 0011.6 0V3.5h-3.6v6.2a2.2 2.2 0 01-4.4 0V3.5z"/><path d="M4.2 7h3.6"/><path d="M12.2 7h3.6"/></svg></span><select id="snap">
        <option value="strong">強</option>
        <option value="weak">弱</option>
        <option value="none">關</option>
      </select>
      <button id="zoomfit" title="縮放至整台 stage">100%</button>
    </span>
    <span class="island"><button id="gearBtn" title="說明・版本・回報問題"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg></button></span>
  </header>
  <div id="body">
    <canvas id="canvas"></canvas>
    <div id="selbar"></div>
    <aside id="inspector"></aside>
  </div>
  <div id="strip"></div>
  <div id="home">
    <div id="homewrap">
      <div class="brand">ALIGNED</div>
      <div class="brandsub">跨頁對齊排版工作檯</div>
      <div id="homeacts">
        <button id="homeNew"><svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M11.5 3.5H5.8A1.3 1.3 0 004.5 4.8v10.4a1.3 1.3 0 001.3 1.3h8.4a1.3 1.3 0 001.3-1.3V7.5z"/><path d="M11.5 3.5v4h4"/></svg>新專案<span class="k">⌘N</span></button>
        <button id="homeOpen"><svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14.5V5.5A1.5 1.5 0 014.5 4h3.2L9.4 6h6.1A1.5 1.5 0 0117 7.5v1"/><path d="M3 14.5L4.6 9.2A1.5 1.5 0 016 8.1h10.9a1 1 0 01.96 1.28l-1.36 4.55a1.5 1.5 0 01-1.44 1.07H3z"/></svg>開啟專案…<span class="k">⌘O</span></button>
      </div>
      <div class="samples">或先逛範例：<a data-sample="/samples/intro">說明輪播（8 頁功能導覽）</a>　<a data-sample="/samples/wrap">排開示範</a>　<span style="opacity:.6">（Esc 也會進說明輪播）</span></div>
      <h3>最近專案</h3>
      <div id="recentgrid"></div>
    </div>
  </div>
  <div id="newsheet">
    <div id="newcard">
      <h2>新專案</h2>
      <div class="row"><label>名稱</label><input id="newname" type="text" value="未命名專案"></div>
      <div class="row"><label>比例</label><select id="newpreset"></select></div>
      <div class="row"><label>方向</label><select id="newflip">
        <option value="0">直式／原比例</option><option value="1">翻轉成橫式</option>
      </select></div>
      <div class="row"><label>頁數</label><input id="newpages" type="number" min="1" max="20" value="1"></div>
      <div id="ratiobox"><div id="ratiosw"></div><div id="ratiotxt"></div></div>
      <div class="acts">
        <button id="newcancel">取消</button>
        <button id="newok" class="primary">建立</button>
      </div>
    </div>
  </div>
  <div id="rensheet">
    <div id="rencard">
      <h2>重新命名</h2>
      <div class="row"><label>名稱</label><input id="renname" type="text" spellcheck="false" autocomplete="off"></div>
      <div class="acts">
        <button id="rencancel">取消</button>
        <button id="renok" class="primary">儲存</button>
      </div>
    </div>
  </div>
  <div id="sheet">
    <header>
      <span id="sheetTitle"></span>
      <span id="sheetSub"></span>
      <span class="spacer"></span>
      <span class="ctl" id="modes">
        <button data-mode="single" class="on">分開</button><button data-mode="joined">連續</button><button data-mode="cards">摺頁</button>
      </span>
      <span class="ctl" id="zoomctl">
        <button id="zoomout" class="icon" title="縮小（⌘−）"><svg width="15" height="15" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4.2 9h9.6"/></svg></button><button id="zoomval" title="全部看到（⌘0）">100%</button><button id="zoomin" class="icon" title="放大（⌘＋）"><svg width="15" height="15" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M9 4.2v9.6"/><path d="M4.2 9h9.6"/></svg></button>
      </span>
      <span class="ctl" id="vidopts">
        <select id="fps"><option value="24">24 fps</option><option value="30" selected>30 fps</option><option value="60">60 fps</option></select>
        <button id="muteBtn" class="icon" title="有聲／靜音"></button>
      </span>
      <span class="ctl" id="pngopts">
        <button id="alphaBtn" title="透明背景：跳過頁底色與紙張，出 RGBA PNG（給剪輯疊層用）"></button>
        <button id="textOnlyBtn" title="只留文字塗鴉：藏起圖片與影片，出字幕／片尾疊層"></button>
        <button id="scaleBtn" title="輸出倍率：2×＝畫布兩倍像素（16:9 畫布＝4K）"></button>
      </span>
      <span class="ctl"><button id="themeBtn" class="icon" title="白盒／暗房"><svg width="15" height="15" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="9" r="5.6"/><path class="fill" stroke="none" d="M9 3.4a5.6 5.6 0 010 11.2z"/></svg></button></span>
      <button id="saveCur">下載這頁</button>
      <button id="saveAll">全部下載</button>
      <button id="closeSheet">關閉</button>
    </header>
    <div id="stage" class="single"><div id="shots"></div></div>
    <div id="sheetFoot">
      <div id="dots"></div>
      <div id="hint"></div>
      <div id="hint2">拖曳平移　⌘捲動／雙指撐開縮放　雙擊在全覽與 100% 之間切換</div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
